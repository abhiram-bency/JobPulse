name: jobpulse

# Local:  cp .env.example .env && docker compose up -d --build
# AWS EC2 (same file):
#   1. Copy .env.example -> .env and set a strong POSTGRES_PASSWORD
#   2. FRONTEND_PORT=80  (open TCP 80 on the instance security group)
#   3. docker compose up -d --build
# Postgres and the API bind to loopback only, so they are not internet-reachable.
# The dashboard (frontend) is the public entrypoint and proxies /api to the backend.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpulse}
      POSTGRES_DB: ${POSTGRES_DB:-jobpulse}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpulse} -d ${POSTGRES_DB:-jobpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-jobpulse-backend:local}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobpulse}:${POSTGRES_PASSWORD:-jobpulse}@db:5432/${POSTGRES_DB:-jobpulse}
      HIMALAYAS_FEED_URL: ${HIMALAYAS_FEED_URL:-https://himalayas.app/jobs/rss}
      HIMALAYAS_USER_AGENT: ${HIMALAYAS_USER_AGENT:-JobPulse/1.0 (job ingestion dashboard)}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-20.0}
      FETCH_MAX_RETRIES: ${FETCH_MAX_RETRIES:-3}
      FETCH_BASE_BACKOFF_SECONDS: ${FETCH_BASE_BACKOFF_SECONDS:-1.0}
      FETCH_MAX_BACKOFF_SECONDS: ${FETCH_MAX_BACKOFF_SECONDS:-30.0}
      MINIMUM_REQUEST_INTERVAL_SECONDS: ${MINIMUM_REQUEST_INTERVAL_SECONDS:-5.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8001}:8000"
    networks:
      - jobpulse
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-jobpulse-frontend:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    networks:
      - jobpulse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jobpulse:
    driver: bridge

volumes:
  postgres_data:
