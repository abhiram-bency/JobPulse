services:
  # ============================================================
  # JobPulse Backend - FastAPI
  # ============================================================
  - type: web
    name: jobpulse-backend
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Run Alembic migrations before starting FastAPI.
    # The existing backend/Dockerfile remains unchanged.
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

    envVars:
      # Render-managed PostgreSQL connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: jobpulse-db
          property: connectionString

      # Real job source required by the assessment.
      - key: HIMALAYAS_FEED_URL
        value: https://himalayas.app/jobs/rss

  # ============================================================
  # JobPulse Frontend - React/Vite + Nginx
  # ============================================================
  - type: web
    name: jobpulse-frontend
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

    # The existing nginx.conf contains:
    #
    #   proxy_pass http://backend:8000;
    #
    # "backend" is the Docker Compose service name used locally.
    #
    # At Render startup, replace that local Docker hostname with
    # the deployed backend's public Render URL.

    dockerCommand: sh -c 'sed -i "s|http://backend:8000|${BACKEND_URL}|g" /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"'
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: jobpulse-backend
          envVarKey: RENDER_EXTERNAL_URL

# ==============================================================
# JobPulse PostgreSQL
# ==============================================================
databases:
  - name: jobpulse-db
    databaseName: jobpulse
    user: jobpulse
    plan: free
    region: singapore
    postgresMajorVersion: "16"